name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy project Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: agltutkeznalftgllmlv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Verify Edge Function source files
        shell: bash
        run: |
          test -f supabase/functions/public-api/index.ts
          test -f supabase/functions/verify-shared-gate/index.ts
          test -f supabase/functions/member-api/index.ts
          echo "All three Edge Function source files are present."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_ID" --use-api --yes
